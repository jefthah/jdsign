openapi: 3.0.3
info:
  title: JD Sign API
  version: 0.1.0
  description: Kontrak API JD Sign. Aturan bisnis lengkap ada di docs/spec.md.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Memeriksa proses API dan koneksi database
      responses:
        "200":
          description: API dan database siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database tidak dapat dihubungi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /categories:
    get:
      operationId: listCategories
      summary: Daftar kategori, urut nama
      responses:
        "200":
          description: Semua kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/Error"
  /auth/code:
    post:
      operationId: requestLoginCode
      summary: Mengirim kode masuk 6 digit ke email
      description: >-
        Dipakai untuk masuk dan mendaftar. Dalam jeda kirim ulang 60 detik tidak ada kode baru
        yang dikirim; `sent` bernilai false dan `secondsUntilResend` memberi sisa jedanya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeRequest"
      responses:
        "200":
          description: Kode terkirim, atau masih dalam jeda kirim ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginCodeStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /auth/code/verify:
    post:
      operationId: verifyLoginCode
      summary: Memeriksa kode masuk lalu memasang cookie sesi
      description: >-
        Email yang belum terdaftar langsung dibuatkan akun pembeli. Respons sukses memasang
        cookie `jdsign_session` (HttpOnly, SameSite=Lax).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLoginCodeRequest"
      responses:
        "200":
          description: Kode benar dan sesi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /auth/google:
    get:
      operationId: startGoogleLogin
      summary: Mengalihkan ke halaman masuk Google (PKCE, state, nonce)
      parameters:
        - name: next
          in: query
          required: false
          description: Path tujuan setelah masuk, misalnya /account
          schema:
            type: string
            maxLength: 500
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
  /auth/google/callback:
    get:
      operationId: finishGoogleLogin
      summary: Menerima jawaban Google, memasang cookie sesi, lalu mengalihkan ke frontend
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          $ref: "#/components/responses/Redirect"
  /auth/logout:
    post:
      operationId: logout
      summary: Menghapus sesi saat ini
      responses:
        "204":
          description: Sesi dihapus
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: Akun yang sedang masuk
      responses:
        "200":
          description: Akun pengguna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /admin/mfa/setup:
    get:
      operationId: getAdminMfaSetup
      summary: Rahasia dan URI QR untuk memasang aplikasi authenticator
      description: >-
        Hanya untuk admin yang belum mengonfirmasi authenticator. Rahasia yang sama dikembalikan
        sampai pemasangan dikonfirmasi, jadi memuat ulang halaman tidak membatalkan QR yang sudah
        dipindai. Kode error 403: `admin_only`, `email_unverified`.
      responses:
        "200":
          description: Rahasia belum dikonfirmasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMfaSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: confirmAdminMfaSetup
      summary: Mengonfirmasi pemasangan authenticator dengan satu kode yang benar
      description: >-
        Mengaktifkan TOTP untuk akun ini dan sekaligus memverifikasi sesi saat ini. Batas laju
        5 percobaan per menit per admin, bersama dengan /admin/mfa/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMfaCode"
      responses:
        "204":
          description: Authenticator aktif dan sesi ini terverifikasi
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/mfa/verify:
    post:
      operationId: verifyAdminMfa
      summary: Memverifikasi sesi saat ini dengan kode authenticator
      description: >-
        Wajib sekali untuk setiap sesi baru sebelum membuka area admin. Kode yang sudah pernah
        dipakai ditolak. 409 `mfa_setup_required` jika authenticator belum dipasang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMfaCode"
      responses:
        "204":
          description: Sesi ini boleh membuka area admin
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/overview:
    get:
      operationId: getAdminOverview
      summary: Ringkasan pekerjaan admin yang menunggu
      description: >-
        Seperti semua endpoint admin lain, mensyaratkan sesi yang sudah diverifikasi authenticator.
        Kode error 403: `admin_only`, `email_unverified`, `mfa_setup_required`, `mfa_required`.
      responses:
        "200":
          description: Jumlah yang perlu ditindaklanjuti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /admin/categories:
    get:
      operationId: listAdminCategories
      summary: Semua kategori beserta jumlah templatenya
      responses:
        "200":
          description: Kategori, urut nama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createCategory
      summary: Membuat kategori
      description: Slug dibuat dari nama jika dikosongkan. 409 `slug_taken` jika slug sudah dipakai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
  /admin/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      operationId: updateCategory
      summary: Mengubah kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Kategori diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCategory
      summary: Menghapus kategori yang tidak dipakai template mana pun
      description: 409 `category_in_use` jika masih ada template, termasuk yang diarsipkan.
      responses:
        "204":
          description: Kategori dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates:
    get:
      operationId: listAdminTemplates
      summary: Template untuk dikelola admin, terbaru diubah lebih dulu, 20 per halaman
      parameters:
        - name: status
          in: query
          required: false
          description: active (belum diarsipkan, bawaan), published, draft, atau archived
          schema:
            type: string
            enum: [active, published, draft, archived]
            default: active
        - name: q
          in: query
          required: false
          description: Dicocokkan pada judul atau teknologi, tanpa membedakan huruf besar/kecil
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Satu halaman template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTemplate
      summary: Membuat template baru sebagai draft
      description: File ZIP dan sampul diunggah sesudahnya lewat /admin/templates/{id}/files/*.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "201":
          description: Template dibuat sebagai draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getAdminTemplate
      summary: Satu template, termasuk yang diarsipkan
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateTemplate
      summary: Mengubah isi template tanpa mengubah statusnya
      description: 409 `template_archived` jika template diarsipkan; pulihkan dulu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateInput"
      responses:
        "200":
          description: Template diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: archiveTemplate
      summary: Mengarsipkan template
      description: >-
        Template hilang dari situs dan kembali menjadi draft. Pembelian lama tidak terpengaruh, dan
        filenya tidak dihapus.
      responses:
        "200":
          description: Template diarsipkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: restoreTemplate
      summary: Memulihkan template yang diarsipkan sebagai draft
      responses:
        "200":
          description: Template dipulihkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: publishTemplate
      summary: Menayangkan template di situs
      description: >-
        409 `template_incomplete` jika file ZIP atau sampul belum diunggah, dan
        `template_archived` jika template diarsipkan.
      responses:
        "200":
          description: Template tayang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}/unpublish:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: unpublishTemplate
      summary: Menurunkan template dari situs menjadi draft
      responses:
        "200":
          description: Template menjadi draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}/files/zip:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: downloadAdminTemplateZip
      summary: Mengunduh ZIP terbaru untuk diperiksa, dengan nama review-<slug>.zip
      responses:
        "200":
          description: File ZIP
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: uploadTemplateZip
      summary: Mengunggah atau mengganti file ZIP template
      description: >-
        Isi permintaan adalah file ZIP mentah (maks. 50 MB) dengan Content-Type
        application/octet-stream. ZIP diperiksa tanpa pernah diekstrak; 422 `invalid_zip` jika ditolak.
        ZIP lama tetap disimpan selama masih dipakai pesanan.
      parameters:
        - name: name
          in: query
          required: false
          description: Nama file asli, hanya untuk ditampilkan
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: ZIP tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
  /admin/templates/{id}/files/cover:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getAdminTemplateCover
      summary: Sampul template (WebP) untuk pratinjau di panel admin
      responses:
        "200":
          description: Gambar sampul
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: uploadTemplateCover
      summary: Mengunggah atau mengganti sampul template
      description: >-
        Isi permintaan adalah gambar JPG, PNG, atau WebP mentah (maks. 2 MB dan 4000×4000 px) dengan
        Content-Type application/octet-stream. Gambar selalu dikodekan ulang ke WebP dan diperkecil
        agar muat dalam 1600×1600 px; 422 `invalid_image` jika ditolak.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Sampul tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: Kesalahan dengan pesan Bahasa Indonesia
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Belum masuk atau sesi sudah berakhir
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Tindakan tidak diizinkan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Tindakan tidak sesuai dengan keadaan saat ini
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: File melebihi ukuran maksimal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Isian tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Batas laju terlampaui
      headers:
        Retry-After:
          description: Detik sampai boleh mencoba lagi
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Layanan pendukung (misalnya email) sedang gagal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Redirect:
      description: Pengalihan
      headers:
        Location:
          required: true
          schema:
            type: string
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
    CategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
    LoginCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          example: nadia@studioarunika.id
    LoginCodeStatus:
      type: object
      required: [email, sent, secondsUntilResend, expiresInSeconds]
      properties:
        email:
          type: string
          description: Email yang sudah dirapikan (huruf kecil, tanpa spasi)
        sent:
          type: boolean
          description: false jika masih dalam jeda kirim ulang sehingga tidak ada kode baru
        secondsUntilResend:
          type: integer
        expiresInSeconds:
          type: integer
          description: Sisa masa berlaku kode yang aktif
    VerifyLoginCodeRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string
          example: "482913"
        remember:
          type: boolean
          default: false
    Account:
      type: object
      required: [id, name, email, role, emailVerified]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
        emailVerified:
          type: boolean
    AdminMfaSetup:
      type: object
      required: [otpauthUri, secret]
      properties:
        otpauthUri:
          type: string
          description: Isi kode QR, otpauth://totp/JD%20Sign:<email>?secret=...&issuer=JD%20Sign
        secret:
          type: string
          description: Rahasia base32 untuk diketik manual ke aplikasi authenticator
    AdminMfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: "492039"
    AdminOverview:
      type: object
      required:
        [pendingSellers, pendingTemplates, pendingPayouts, pendingPayoutAmount, ordersInReview, publishedTemplates, draftTemplates, categories]
      properties:
        publishedTemplates:
          type: integer
          description: Template tayang di situs
        draftTemplates:
          type: integer
          description: Template draft yang belum diarsipkan
        categories:
          type: integer
          description: Jumlah kategori
        pendingSellers:
          type: integer
          description: Toko menunggu moderasi
        pendingTemplates:
          type: integer
          description: Template perlu ditinjau
        pendingPayouts:
          type: integer
          description: Pengajuan pencairan menunggu transfer
        pendingPayoutAmount:
          type: integer
          format: int64
          description: Total rupiah pencairan yang menunggu transfer
        ordersInReview:
          type: integer
          description: Pesanan perlu rekonsiliasi (status review)
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1–80 karakter
        slug:
          type: string
          description: Huruf kecil, angka, dan tanda hubung (maks. 100). Kosong berarti dibuat dari nama.
        description:
          type: string
          nullable: true
          description: Maks. 255 karakter
    AdminCategory:
      type: object
      required: [id, name, slug, templateCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        templateCount:
          type: integer
          description: Semua template di kategori ini, termasuk yang diarsipkan
    AdminCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminCategory"
    TemplateInput:
      type: object
      required: [categoryId, title, summary, description, price, version, technology]
      properties:
        categoryId:
          type: integer
          format: int64
        title:
          type: string
          description: Maks. 160 karakter
        summary:
          type: string
          description: Maks. 240 karakter
        description:
          type: string
          description: 30–20.000 karakter, ditampilkan sebagai teks biasa
        price:
          type: integer
          format: int64
          description: Rupiah utuh, Rp10.000–Rp100.000.000
        version:
          type: string
          description: Maks. 40 karakter, misalnya 1.0.0
        technology:
          type: string
          description: Maks. 80 karakter, misalnya Next.js + Tailwind
        previewUrl:
          type: string
          nullable: true
          description: Opsional, harus https://, maks. 500 karakter
    TemplateZip:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
          description: Ukuran dalam byte
    AdminTemplate:
      type: object
      required:
        [id, slug, title, summary, description, price, version, technology, category, status, archived, hasCover, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
        version:
          type: string
        technology:
          type: string
        previewUrl:
          type: string
          nullable: true
        category:
          $ref: "#/components/schemas/Category"
        status:
          type: string
          enum: [draft, published]
        archived:
          type: boolean
        zip:
          allOf:
            - $ref: "#/components/schemas/TemplateZip"
          nullable: true
        hasCover:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminTemplateList:
      type: object
      required: [data, page, perPage, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminTemplate"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
