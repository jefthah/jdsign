openapi: 3.0.3
info:
  title: JD Sign API
  version: 0.1.0
  description: Kontrak API JD Sign. Aturan bisnis lengkap ada di docs/spec.md.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Memeriksa proses API dan koneksi database
      responses:
        "200":
          description: API dan database siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database tidak dapat dihubungi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /categories:
    get:
      operationId: listCategories
      summary: Daftar kategori, urut nama
      responses:
        "200":
          description: Semua kategori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Kesalahan dengan pesan Bahasa Indonesia
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
    CategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
