name: jdsign-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jdsign
      POSTGRES_DB: jdsign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    mem_limit: 512m
    cpus: 1
    shm_size: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdsign -d jdsign"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: jdsign-api:${RELEASE_SHA:?required}
    user: "10001:10001"
    restart: unless-stopped
    environment:
      APP_ENV: staging
      HTTP_ADDR: 0.0.0.0:8300
      DATABASE_URL: postgres://jdsign:${POSTGRES_PASSWORD:?required}@postgres:5432/jdsign?sslmode=disable
      APP_URL: https://staging.jd-sign.com
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:?required}
      # Optional on staging. Without it the admin area stays closed (authenticators cannot be stored).
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      # Optional. Without RESEND_API_KEY, login codes are written to the API log only.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Optional. Google sign-in stays off until both are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Private disk for template ZIPs and covers (docs/spec.md 7.3). The image creates the folder
      # owned by the API user, so the new volume starts out writable.
      STORAGE_DIR: /var/lib/jdsign/storage
      GOMEMLIMIT: 192MiB
    ports: ["127.0.0.1:18300:8300"]
    networks: [database, frontend]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - template-files:/var/lib/jdsign/storage
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8300/api/v1/health"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    image: jdsign-web:${RELEASE_SHA:?required}
    user: "1000:1000"
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8300/api/v1
      NODE_OPTIONS: --max-old-space-size=384
    ports: ["127.0.0.1:13300:3000"]
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    logging: *logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  database:
    internal: true
  frontend:

volumes:
  postgres-data:
  template-files:
