# Generate dari folder apps/api (butuh Docker):
#   docker run --rm -v "<path ke apps/api>:/src" -w /src sqlc/sqlc:latest generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/database/queries
    gen:
      go:
        package: sqlcdb
        out: internal/database/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
